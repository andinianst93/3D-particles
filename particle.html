<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hand & Face Particle Tracking</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: #0a0a0f;
                overflow: hidden;
                font-family: "Segoe UI", sans-serif;
            }

            #container {
                position: relative;
                width: 100vw;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            #video {
                position: absolute;
                transform: scaleX(-1);
                width: 100%;
                height: 100%;
                object-fit: cover;
                opacity: 0.6;
            }

            #canvas {
                position: absolute;
                transform: scaleX(-1);
                width: 100%;
                height: 100%;
                pointer-events: none;
            }

            #controls {
                position: fixed;
                top: 20px;
                left: 20px;
                z-index: 100;
                background: rgba(0, 0, 0, 0.75);
                padding: 20px;
                border-radius: 15px;
                color: white;
                backdrop-filter: blur(15px);
                border: 1px solid rgba(255, 255, 255, 0.1);
                max-width: 280px;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            }

            #controls h3 {
                margin-bottom: 15px;
                font-weight: 300;
                font-size: 14px;
                text-transform: uppercase;
                letter-spacing: 2px;
                color: #ffd700;
            }

            .control-group {
                margin-bottom: 15px;
            }

            .control-group label {
                display: block;
                font-size: 12px;
                margin-bottom: 5px;
                opacity: 0.8;
            }

            .control-group input[type="range"] {
                width: 100%;
                height: 4px;
                border-radius: 2px;
                background: rgba(255, 255, 255, 0.2);
                outline: none;
                -webkit-appearance: none;
            }

            .control-group input[type="range"]::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: #ffd700;
                cursor: pointer;
            }

            .color-buttons {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
            }

            .color-btn {
                width: 30px;
                height: 30px;
                border-radius: 50%;
                border: 2px solid transparent;
                cursor: pointer;
                transition: all 0.3s;
            }

            .color-btn:hover,
            .color-btn.active {
                border-color: white;
                transform: scale(1.1);
            }

            #startBtn {
                width: 100%;
                padding: 12px;
                background: linear-gradient(135deg, #ffd700, #ff8c00);
                border: none;
                border-radius: 8px;
                color: #000;
                font-weight: bold;
                cursor: pointer;
                font-size: 14px;
                transition: all 0.3s;
                margin-bottom: 10px;
            }

            #startBtn:hover:not(:disabled) {
                transform: translateY(-2px);
                box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
            }

            #startBtn:disabled {
                opacity: 0.7;
                cursor: not-allowed;
            }

            .toggle-group {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 10px;
            }

            .toggle-group label {
                font-size: 12px;
                opacity: 0.8;
            }

            .toggle {
                position: relative;
                width: 44px;
                height: 22px;
            }

            .toggle input {
                opacity: 0;
                width: 0;
                height: 0;
            }

            .toggle-slider {
                position: absolute;
                cursor: pointer;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: rgba(255, 255, 255, 0.2);
                transition: 0.3s;
                border-radius: 22px;
            }

            .toggle-slider:before {
                position: absolute;
                content: "";
                height: 16px;
                width: 16px;
                left: 3px;
                bottom: 3px;
                background-color: white;
                transition: 0.3s;
                border-radius: 50%;
            }

            .toggle input:checked + .toggle-slider {
                background-color: #ffd700;
            }

            .toggle input:checked + .toggle-slider:before {
                transform: translateX(22px);
            }

            #status {
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                color: white;
                font-size: 14px;
                background: rgba(0, 0, 0, 0.75);
                padding: 12px 24px;
                border-radius: 25px;
                backdrop-filter: blur(15px);
                border: 1px solid rgba(255, 255, 255, 0.1);
                box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            }

            .loading {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: white;
                font-size: 18px;
                text-align: center;
                z-index: 200;
            }

            .loading .spinner {
                width: 50px;
                height: 50px;
                border: 3px solid rgba(255, 215, 0, 0.3);
                border-top-color: #ffd700;
                border-radius: 50%;
                animation: spin 1s linear infinite;
                margin: 0 auto 20px;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .credits {
                position: fixed;
                bottom: 20px;
                right: 20px;
                color: rgba(255, 255, 255, 0.5);
                font-size: 11px;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <video id="video" playsinline></video>
            <canvas id="canvas"></canvas>
        </div>

        <div id="controls">
            <h3>✨ Particle Controls</h3>

            <div class="toggle-group">
                <label>Show Webcam</label>
                <label class="toggle">
                    <input type="checkbox" id="showWebcam" checked />
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <div class="control-group">
                <label>Webcam Opacity: <span id="opacityVal">60</span>%</label>
                <input
                    type="range"
                    id="webcamOpacity"
                    min="0"
                    max="100"
                    value="60"
                />
            </div>

            <div class="control-group">
                <label>Particle Size: <span id="sizeVal">3</span></label>
                <input
                    type="range"
                    id="particleSize"
                    min="1"
                    max="8"
                    value="3"
                    step="0.5"
                />
            </div>

            <div class="control-group">
                <label>Trail Length: <span id="trailVal">15</span></label>
                <input
                    type="range"
                    id="trailLength"
                    min="5"
                    max="40"
                    value="15"
                />
            </div>

            <div class="control-group">
                <label>Particle Density: <span id="densityVal">2</span></label>
                <input type="range" id="density" min="1" max="5" value="2" />
            </div>

            <div class="control-group">
                <label>Glow Intensity: <span id="glowVal">20</span></label>
                <input
                    type="range"
                    id="glowIntensity"
                    min="5"
                    max="50"
                    value="20"
                />
            </div>

            <div class="control-group">
                <label>Color Theme</label>
                <div class="color-buttons">
                    <button
                        class="color-btn active"
                        data-color="gold"
                        style="
                            background: linear-gradient(
                                135deg,
                                #ffd700,
                                #ff8c00
                            );
                        "
                    ></button>
                    <button
                        class="color-btn"
                        data-color="cyan"
                        style="
                            background: linear-gradient(
                                135deg,
                                #00ffff,
                                #0080ff
                            );
                        "
                    ></button>
                    <button
                        class="color-btn"
                        data-color="magenta"
                        style="
                            background: linear-gradient(
                                135deg,
                                #ff00ff,
                                #ff0080
                            );
                        "
                    ></button>
                    <button
                        class="color-btn"
                        data-color="green"
                        style="
                            background: linear-gradient(
                                135deg,
                                #00ff88,
                                #00ff00
                            );
                        "
                    ></button>
                    <button
                        class="color-btn"
                        data-color="rainbow"
                        style="
                            background: linear-gradient(
                                135deg,
                                #ff0000,
                                #ffff00,
                                #00ff00,
                                #00ffff,
                                #0000ff,
                                #ff00ff
                            );
                        "
                    ></button>
                </div>
            </div>

            <button id="startBtn">🎥 Start Camera</button>
        </div>

        <div id="status">Click "Start Camera" to begin</div>

        <div class="loading" id="loading" style="display: none">
            <div class="spinner"></div>
            <div>Loading AI Models...</div>
        </div>

        <div class="credits">Hand & Face Particle Tracking with MediaPipe</div>

        <!-- MediaPipe Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
            crossorigin="anonymous"
        ></script>
        <script
            src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
            crossorigin="anonymous"
        ></script>
        <script
            src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"
            crossorigin="anonymous"
        ></script>

        <!-- Main Application -->
        <script src="app.js"></script>
    </body>
</html>
